spring.application.name=MY TOON

spring.datasource.url=jdbc:postgresql://localhost:5432/mytoon
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:}

oauth2.kakao.client-id=${KAKAO_CLIENT_ID:}
oauth2.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth2.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}

# HS256은 최소 256비트(32바이트) 키가 필요 - JWT_SECRET은 32자 이상으로 설정해야 함
jwt.secret=${JWT_SECRET:}

# 회차 이미지 저장 루트 디렉토리 (초기 로컬 디스크, 상대경로면 애플리케이션 실행 위치 기준)
app.upload.root-dir=${UPLOAD_ROOT_DIR:uploads}

# 이미지 업로드는 장당 10MB, 회차당 최대 300장 - 요청 전체 용량 한도는 여유 있게 잡음
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=1GB
